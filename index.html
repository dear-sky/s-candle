<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sky シーキャンシミュレーター | Dear Sky Kids</title>
  
  <!-- Flatpickrのスタイルとスクリプト -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/ja.js"></script>

  <style>
    /* ==========================================
       Dear Sky kids - Sky イベントシミュレーター スタイル
       ========================================== */

    /* 全体の基本設定（ボックスサイズ指定の統一） */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      background-image: none !important;
      background-color: #e0f2fe; /* 爽やかなスカイブルー背景 */
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* メインコンテナ */
    .sky-simulator {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 20px;
      background-color: #ffffff;
      color: #1e293b;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.2);
      border: 1.5px solid #7dd3fc;
    }

    /* ヘッダー */
    .sim-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #0284c7;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .sim-header-text {
      font-size: 1rem;
      font-weight: 800;
      color: #454c5c;
      margin: 0;
      line-height: 1.3;
    }

    /* ダッシュボード表示部 */
    .sim-dashboard {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      width: 100%;
    }

    .sim-dashboard-row {
      display: flex;
      gap: 10px; /* カード間の横余白 */
      width: 100%;
    }

    .sim-stat-box {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      padding: 10px 4px;
      border-radius: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1; /* 3つの枠を均等幅に分割 */
      min-width: 0;
      overflow: visible; /* 親枠での画像切れを防止 */
    }

    .sim-stat-box-full {
      width: 100%; /* 上段3つの合計幅にピッタリ合わせる */
      box-sizing: border-box;
    }

    /* ステータス部分（ハイライト） */
    .sim-stat-box.sim-highlight {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      border: 1.5px solid #38bdf8;
    }

    .sim-label {
      font-size: 10.5px;
      color: #334155;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .sim-value {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      word-break: break-all;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 4px;
      line-height: 1.5 !important;
      overflow: visible !important; /* 途切れ防止 */
    }

    .sim-value-sub {
      font-size: 1.1rem;
      font-weight: bold;
      color: #333333;
    }

    /* ステータス文字色（クッキリスカイブルー） */
    .sim-highlight .sim-value,
    #status-text {
      color: #0284c7 !important;
      font-weight: 800;
    }

    /* 設定エリア */
    .sim-settings {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      padding: 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 16px;
    }

    /* 日付入力グループ */
    .sim-date-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #bae6fd;
    }

    .sim-date-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sim-date-label label {
      font-size: 11.5px;
      color: #334155;
      font-weight: 700;
    }

    .sim-date-label input[type="date"] {
      width: 100%;
      background-color: #ffffff;
      border: 1px solid #7dd3fc;
      color: #1a5e8b;
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 16px; /* ズーム防止用 */
      font-weight: 600;
      font-family: inherit;
      outline: none;
    }

    .sim-date-label input[type="date"]:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
    }

    /* 目標数入力グループ */
    .sim-target-group {
      padding-bottom: 12px;
      border-bottom: 1px solid #bae6fd;
    }

    .sim-target-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sim-target-label label {
      font-size: 11.5px;
      color: #334155;
      font-weight: 700;
    }

    .sim-target-label input[type="number"] {
      width: 100%;
      background-color: #ffffff;
      border: 1px solid #7dd3fc;
      color: #0f172a;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 16px; /* ズーム防止用 */
      font-weight: bold;
      font-family: inherit;
      outline: none;
    }

    .sim-target-label input[type="number"]:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
    }

    /* 数値入力のスピンボタン非表示 */
    .sim-target-label input[type="number"]::-webkit-outer-spin-button,
    .sim-target-label input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .sim-target-label input[type="number"] {
      -moz-appearance: textfield;
    }

    /* トグル・チェックボックスグループ */
    .sim-toggle-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sim-toggle {
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #417ad6;
      user-select: none;
    }

    .sim-toggle input[type="checkbox"] {
      accent-color: #0284c7;
      width: 16px;
      height: 16px;
      cursor: pointer;
      margin: 0;
    }

    /* フッター */
    .footer-credit {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      margin-top: 4px;
    }

    .creator-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .insta-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #0284c7;
      text-decoration: none;
      font-weight: bold;
      padding: 4px 8px;
      background-color: #f0f9ff;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .insta-link:hover {
      background-color: #e0f2fe;
    }

    .insta-icon {
      fill: currentColor;
    }

    .copyright-notice {
      font-size: 0.80rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    /* カレンダー（Flatpickr）関連 */
    .flatpickr-calendar {
      touch-action: manipulation; /* ダブルタップズーム防止 */
    }

    .flatpickr-day.selected, 
    .flatpickr-day.selected:hover {
      background: #0284c7 !important;
      border-color: #0284c7 !important;
    }

    .flatpickr-day.today {
      border-color: #0284c7 !important;
    }

    .flatpickr-day:hover {
      background: #e0f2fe !important;
    }

    input[type="date"],
    .flatpickr-input {
      border: 1.5px solid #7dd3fc;
      border-radius: 8px;
      padding: 10px 12px;
      background-color: #ffffff;
      color: #333333;
      outline: none;
      box-sizing: border-box;
      width: 100%;
      font-size: 16px !important; /* スマホタップ時のズームを防止 */
    }

    input[type="date"]:focus,
    .flatpickr-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
    }

    /* ドット絵アイコンの配置・途切れ防止設定 */
    .pixel-icon {
      width: auto !important;
      height: 1.4em !important;
      max-height: 28px !important;
      object-fit: contain !important;
      
      image-rendering: pixelated !important;
      image-rendering: -moz-crisp-edges !important;
      image-rendering: crisp-edges !important;
      -ms-interpolation-mode: nearest-neighbor !important;
      
      display: inline-block !important;
      vertical-align: middle !important;
      margin: -2px 2px 0 2px !important;
    }
  </style>
</head>
<body>

<main class="sky-simulator">
  
  <div class="sim-header">
    <div class="brand-title">𓆩 Dear Sky kids 𓆪</div>
    <h1 class="sim-header-text">シーズンキャンドル シミュレーター</h1>
  </div>

  <!-- 結果ダッシュボード -->
  <div class="sim-dashboard">
    <!-- 上段：元からある3つの枠（横並び） -->
    <div class="sim-dashboard-row">
      <div class="sim-stat-box">
        <span class="sim-label">目標数</span>
        <span class="sim-value" id="target-cost"><img src="ssc_img/icon_candle.png" alt="🕯️" class="pixel-icon"> 0</span>
      </div>
      <div class="sim-stat-box">
        <span class="sim-label">獲得可能数</span>
        <span class="sim-value" id="possible-get"><img src="ssc_img/icon_candle.png" alt="🕯️" class="pixel-icon"> -</span>
      </div>
      <div class="sim-stat-box sim-highlight">
        <span class="sim-label">ステータス</span>
        <span class="sim-value" id="status-text">終了日を設定</span>
      </div>
    </div>

    <!-- 下段：追加した枠（上段3つの合計幅にぴったり合わせる） -->
    <div class="sim-stat-box sim-stat-box-full">
      <span class="sim-label"> デイリークエストを… </span>
      <span class="sim-value sim-value-sub" id="required-days-text">-</span>
    </div>
  </div>

  <!-- 設定・入力エリア -->
  <div class="sim-settings">
    <!-- 日付指定フォーム -->
    <div class="sim-date-group">
      <div class="sim-date-label">
        <label for="input-start-date">開始日:</label>
        <input type="date" id="input-start-date">
      </div>
      <div class="sim-date-label">
        <label for="input-end-date">終了日:</label>
        <input type="date" id="input-end-date">
      </div>
    </div>

    <!-- 目標キャンドル数入力 -->
    <div class="sim-target-group">
      <div class="sim-target-label">
        <label for="input-target-candles">目標キャンドル数:</label>
        <input type="number" id="input-target-candles" placeholder="例: 150" min="0" value="0">
      </div>
    </div>

    <!-- パスチェックボックス -->
    <div class="sim-toggle-group">
      <label class="sim-toggle">
        <input type="checkbox" id="toggle-pass">
        <span>🎫 シーズンパスあり (+1日1本＆特典+30本)</span>
      </label>
      <div style="font-size: 12.5px; color: #6e959e; font-weight: 600; padding-left: 24px; margin-top: 2px;">
        ⚠ チェックをいれると、獲得可能数に特典の30本込みの数字が表示されます。
      </div>
    </div>
  </div>

  <!-- 著作権表記 -->
  <footer class="footer-credit">
    <!-- 制作者＆インスタリンク -->
    <p class="author-info">
      Created by 𓆩 Dear Sky kids 𓆪
      <a href="https://www.instagram.com/dear.sky.kids/" target="_blank" rel="noopener noreferrer" class="insta-link">
        <svg class="insta-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
      </a>
    </p>

    <!-- Sky公式 権利表記（必須） -->
    <p class="copyright-notice">
      ー 本ツールはファン制作による非公式ツールです。 ー<br>
      『Sky 星を紡ぐ子どもたち』の著作権および商標権は thatgamecompany, Inc. に帰属します。
    </p>
  </footer>

</main>

<!-- スクリプトの読み込みと処理 -->
<script>
// ==========================================
// 1. アイコン画像置換の設定＆関数
// ==========================================
const IMG_BASE_PATH = 'ssc_img/';

const iconMap = {
  '🕯️': 'icon_candle.png'
};

function replaceEmojisWithIcons(inputText) {
  let result = String(inputText);
  for (const [emoji, fileName] of Object.entries(iconMap)) {
    const imgTag = `<img src="${IMG_BASE_PATH}${fileName}" alt="${emoji}" class="pixel-icon">`;
    result = result.replaceAll(emoji, imgTag);
  }
  return result;
}

// ==========================================
// 2. メイン計算処理
// ==========================================
document.addEventListener("DOMContentLoaded", () => {
  const startDateInput = document.getElementById("input-start-date");
  const endDateInput = document.getElementById("input-end-date");
  const targetInput = document.getElementById("input-target-candles");
  const passToggle = document.getElementById("toggle-pass");

  const targetCostText = document.getElementById("target-cost");
  const possibleGetText = document.getElementById("possible-get");
  const statusText = document.getElementById("status-text");
  const requiredDaysText = document.getElementById("required-days-text");

  // デフォルト: 開始日のみ今日、終了日は未選択
  const today = new Date();
  if (startDateInput) startDateInput.value = formatDate(today);
  if (endDateInput) endDateInput.value = "";

  function formatDate(d) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function calculateResetCycles(startStr, endStr) {
    if (!startStr || !endStr) return 0;

    const s = startStr.split('-').map(Number);
    const e = endStr.split('-').map(Number);

    if (s.length !== 3 || e.length !== 3) return 0;

    const startUtc = Date.UTC(s[0], s[1] - 1, s[2]);
    const endUtc = Date.UTC(e[0], e[1] - 1, e[2]);

    if (startUtc > endUtc) return 0;

    const msPerDay = 1000 * 60 * 60 * 24;
    return Math.floor((endUtc - startUtc) / msPerDay);
  }

  function calculate() {
    const startVal = startDateInput ? startDateInput.value : "";
    const endVal = endDateInput ? endDateInput.value : "";
    const targetCost = targetInput ? (parseInt(targetInput.value, 10) || 0) : 0;
    const hasPass = passToggle ? passToggle.checked : false;

    // ① 目標コスト
    if (targetCostText) {
      targetCostText.innerHTML = replaceEmojisWithIcons(`🕯️ ${targetCost}`);
    }

    // 更新サイクルの回数（日）
    const totalDays = calculateResetCycles(startVal, endVal);

    if (totalDays <= 0) {
      if (possibleGetText) possibleGetText.innerHTML = replaceEmojisWithIcons("🕯️ -");
      if (statusText) {
        statusText.textContent = "終了日を設定";
        statusText.style.color = "#0284c7";
      }
      if (requiredDaysText) {
        requiredDaysText.textContent = "-";
        requiredDaysText.style.color = "#333333";
      }
      return;
    }

    // ② 獲得可能数
    const dailyRate = hasPass ? 6 : 5;
    const passBonus = hasPass ? 30 : 0;
    const maxPossible = (totalDays * dailyRate) + passBonus;

    if (possibleGetText) {
      possibleGetText.innerHTML = replaceEmojisWithIcons(`🕯️ ${maxPossible}`);
    }

    // ③ 既存のステータス表示（＋差分 / －不足分）
    if (statusText) {
      if (targetCost <= 0) {
        statusText.textContent = "目標数を設定";
        statusText.style.color = "#0284c7";
      } else if (maxPossible >= targetCost) {
        const surplus = maxPossible - targetCost;
        statusText.innerHTML = replaceEmojisWithIcons(`+🕯️${surplus}`);
        statusText.style.color = "#0284c7";
      } else {
        const shortage = targetCost - maxPossible;
        statusText.innerHTML = replaceEmojisWithIcons(`－🕯️${shortage}`);
        statusText.style.color = "#bb5959";
      }
    }

    // ④ 専用枠：《◯◯日中〇〇日で達成》
    if (requiredDaysText) {
      if (targetCost <= 0) {
        requiredDaysText.textContent = "-";
        requiredDaysText.style.color = "#333333";
      } else {
        let neededDays = 0;
        if (hasPass) {
          const remainingCost = Math.max(0, targetCost - 30);
          neededDays = Math.ceil(remainingCost / 6);
        } else {
          neededDays = Math.ceil(targetCost / 5);
        }

        if (maxPossible >= targetCost) {
          requiredDaysText.textContent = `《 ${totalDays}日中${neededDays}日こなせば達成 》`;
          requiredDaysText.style.color = "#0284c7";
        } else {
          requiredDaysText.textContent = `《 ${totalDays}日では達成不可 》`;
          requiredDaysText.style.color = "#bb5959";
        }
      }
    }
  }

  // イベントリスナー
  ["change", "input"].forEach(evt => {
    if (startDateInput) startDateInput.addEventListener(evt, calculate);
    if (endDateInput) endDateInput.addEventListener(evt, calculate);
    if (targetInput) targetInput.addEventListener(evt, calculate);
    if (passToggle) passToggle.addEventListener(evt, calculate);
  });

  calculate();
});

// 日付入力欄をFlatpickrに適用
flatpickr('input[type="date"]', {
  locale: 'ja',
  dateFormat: 'Y-m-d',
  disableMobile: "true",
  onChange: function() {
    if (typeof calculate === "function") calculate();
  }
});
</script>
</body>
</html>
